<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vodevs Studio</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <!-- Shell -->
    <div id="shell">
      <!-- Menu Bar -->
      <div id="menubar">
        <button class="menubar-item" data-menu="file">File</button>
        <button class="menubar-item" data-menu="edit">Edit</button>
        <button class="menubar-item" data-menu="view">View</button>
        <button class="menubar-item" data-menu="plugins">Plugins</button>
        <button class="menubar-item" data-menu="help">Help</button>
      </div>

      <!-- Ribbon -->
      <div id="ribbon">
        <div id="ribbon-tabs">
          <button class="ribbon-tab active" data-tab="home">Home</button>
          <button class="ribbon-tab" data-tab="model">Model</button>
          <button class="ribbon-tab" data-tab="test">Test</button>
          <button class="ribbon-tab" data-tab="view">View</button>
          <button class="ribbon-tab" data-tab="plugins">Plugins</button>
        </div>
        <div id="ribbon-content">
          <!-- Content populated by ribbon.js -->
        </div>
      </div>

      <!-- Main Workspace -->
      <div id="workspace">
        <!-- Dock container -->
        <div id="dock-container"></div>
      </div>

      <!-- Status Bar -->
      <div id="status-bar">
        <div class="status-left">
          <span class="status-item">📁 <span id="statusProject">No Project</span></span>
          <span class="status-item">📦 <span id="statusParts">0</span> parts</span>
          <span class="status-item">📐 <span id="statusTriangles">0</span> tris</span>
        </div>
        <div class="status-right">
          <span class="status-item" id="statusFPS">⚡ 60 FPS</span>
          <span class="status-item" id="statusMemory">💾 0 MB</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Overlays -->
  <div id="loadingOverlay">
    <div id="loadingModal">
      <div class="lm-titlebar">
        <div class="lm-titlebar-left">⏳ Vodevs Studio</div>
        <button class="lm-close" id="lmCloseX">✕</button>
      </div>
      <div class="lm-body">
        <div class="lm-icon">🚀</div>
        <div class="lm-text">
          <p class="lm-project-name" id="lmProjectName">Untitled</p>
          <div class="lm-status-row">
            <div class="lm-spinner"></div>
            <span id="lmStatusText">Opening...</span>
          </div>
          <div class="lm-progress-track"><div class="lm-progress-fill" id="lmProgressFill"></div></div>
        </div>
      </div>
      <div class="lm-footer">
        <button id="lmCancelBtn">Cancel</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>
  <div id="vxContextMenu" class="vx-ctx-menu"></div>
  <div id="commandPalette" class="command-palette">
    <div class="command-palette-overlay"></div>
    <div class="command-palette-modal">
      <input type="text" id="commandSearch" placeholder="Search commands... (Ctrl+K)">
      <div id="commandResults"></div>
    </div>
  </div>

  <script type="importmap" src="importmap.json"></script>
  <script type="module" src="main.js"></script>
</body>
</html>
